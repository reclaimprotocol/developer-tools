name: Publish Builder MCP registry metadata

on:
  # Called by release.yml after npm publish. The push trigger below stays for
  # server.json edits that are not part of a release (release.yml does not touch
  # server.json paths, so a release does not publish twice).
  workflow_call:
    inputs:
      version:
        description: Exact @reclaimprotocol/agent version to register. Leave empty to use the latest version on npm.
        type: string
        required: false
        default: ''
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
      - scripts/check-builder-mcp.mjs
      - scripts/prepare-builder-registry.mjs

permissions:
  contents: read

concurrency:
  group: reclaim-mcp-registry
  cancel-in-progress: false

jobs:
  # Runs the published package with npx, so it gets no OIDC identity.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.package.outputs.ready }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - name: Check published Builder package ownership metadata
        id: package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-builder-registry.mjs
      - name: Check the published Builder stdio MCP
        if: steps.package.outputs.ready == 'true'
        run: node scripts/check-builder-mcp.mjs
      # The publish job checks out the committed server.json, so hand it the
      # version-stamped copy.
      - name: Upload prepared server.json
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-json
          path: server.json
          if-no-files-found: error
          retention-days: 1

  # Holds the OIDC identity and runs only the pinned publisher. Login is the
  # last step before publish.
  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Download prepared server.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-json
      - name: Install pinned MCP publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz -o mcp-publisher.tar.gz
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate Builder registry metadata
        run: ./mcp-publisher validate server.json
      - name: Authenticate using repository identity
        run: ./mcp-publisher login github-oidc
      - name: Publish Builder registry entry
        run: ./mcp-publisher publish server.json
