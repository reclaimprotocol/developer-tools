name: Publish Reclaim MCP registry metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
      - scripts/check-mcp.mjs

permissions:
  contents: read

concurrency:
  group: reclaim-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check the live MCP endpoint
        run: node scripts/check-mcp.mjs
      - name: Install pinned MCP publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz -o mcp-publisher.tar.gz
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate metadata
        run: ./mcp-publisher validate server.json
      - name: Authenticate using repository identity
        run: ./mcp-publisher login github-oidc
      - name: Publish registry entry
        run: ./mcp-publisher publish server.json
