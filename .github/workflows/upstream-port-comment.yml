# Labels pull requests that change mirrored packages and posts one explanatory comment.
# This workflow has write permissions. It never checks out or runs pull request code,
# and it treats the downloaded artifact as untrusted input.
name: upstream-port-comment

on:
  workflow_run:
    workflows: [upstream-port-label]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-port
          path: upstream-port
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Label and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr="$(tr -d '[:space:]' < upstream-port/pr-number)"
          if ! [[ "${pr}" =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::The artifact does not contain a valid pull request number."
            exit 1
          fi

          # Re-derive everything from the API. Do not trust the artifact beyond the number.
          info="$(gh api "repos/${REPO}/pulls/${pr}" --jq '[.state, .head.sha, .head.ref, .head.repo.full_name, .base.repo.full_name, .changed_files] | @tsv')"
          IFS=$'\t' read -r state head_sha head_ref head_repo base_repo changed_files <<<"${info}"

          if [ "${state}" != "open" ] || [ "${head_sha}" != "${RUN_HEAD_SHA}" ]; then
            echo "Pull request is closed or has newer commits. Skipping."
            exit 0
          fi
          if [ "${head_ref}" = "mirror/builder" ] && [ "${head_repo}" = "${base_repo}" ]; then
            echo "Mirror pull request. Skipping."
            exit 0
          fi

          # The files API returns at most 3000 files. Skip labeling when the list is incomplete.
          if [ "${changed_files}" -gt 3000 ]; then
            echo "Pull request changes ${changed_files} files, which is more than the API lists. Skipping."
            exit 0
          fi
          files="$(gh api --paginate "repos/${REPO}/pulls/${pr}/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
          listed="$(gh api --paginate "repos/${REPO}/pulls/${pr}/files?per_page=100" --jq '.[] | .filename' | wc -l | tr -d '[:space:]')"
          if [ "${listed}" -ne "${changed_files}" ]; then
            echo "The API listed ${listed} files but the pull request changes ${changed_files}. Skipping."
            exit 0
          fi
          if ! grep -qE '^(packages/|package\.json$|package-lock\.json$|\.npmrc$|\.nvmrc$)' <<<"${files}"; then
            echo "No changes to guarded paths. Skipping."
            exit 0
          fi

          gh label create needs-upstream-port --repo "${REPO}" --color FBCA04 \
            --description "Change to a mirrored package that a maintainer must port upstream" 2>/dev/null || true
          gh pr edit "${pr}" --repo "${REPO}" --add-label needs-upstream-port

          marker='<!-- upstream-port -->'
          existing="$(gh api --paginate "repos/${REPO}/issues/${pr}/comments?per_page=100" --jq '.[].body' | grep -cF "${marker}" || true)"
          if [ "${existing}" -gt 0 ]; then
            echo "Comment already exists. Skipping."
            exit 0
          fi

          cat > comment.md <<'BODY'
          <!-- upstream-port -->
          Thanks for the contribution!

          The `packages/` directory is mirrored from Reclaim's monorepo, so this repository can't merge changes to it directly. A maintainer will port your change upstream and add you as a co-author. When the change syncs back, a bot closes this pull request with a link to the sync commit, and you're credited as a co-author.

          CI still runs on this pull request, so keep the tests passing while you wait.
          BODY
          gh pr comment "${pr}" --repo "${REPO}" --body-file comment.md
